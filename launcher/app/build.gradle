plugins {
    id 'com.android.application'
}

// Local signing credentials — NEVER commit launcher/signing.properties.
def signingFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingFile.isFile()) {
    signingFile.withInputStream { input -> signingProps.load(input) }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 16
        versionName '4.8-rc1'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (signingFile.isFile()) {
                storeFile file(signingProps.getProperty('storeFile', ''))
                storePassword signingProps.getProperty('storePassword', '')
                keyAlias signingProps.getProperty('keyAlias', '')
                keyPassword signingProps.getProperty('keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    // Give the generated APK a stable, recognizable filename.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = 'tv-launcher.apk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}

// Refuse release builds without a complete signing configuration.
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease')) {
        if (!signingFile.isFile()) {
            throw new GradleException('Missing launcher/signing.properties')
        }
        ['storeFile','storePassword','keyAlias','keyPassword'].each { key ->
            if (!signingProps.getProperty(key)?.trim()) {
                throw new GradleException('Missing signing key property: ' + key)
            }
        }
        if (!file(signingProps.getProperty('storeFile')).isFile()) {
            throw new GradleException('Release keystore file does not exist')
        }
    }
}
