name: Publish TV-Launcher Min v4.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v46.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-tv-launcher-4.6.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install package inspection tools
        run: sdkmanager "build-tools;34.0.0"

      - name: Fetch previously signed v4.4 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v46"
          gh run download 39524254894 \
            --repo vincent-deprato/tv-launcher-min \
            --name tv-launcher-v4.6-release-signed \
            --dir "$RUNNER_TEMP/v46"
          test -s "$RUNNER_TEMP/v46/tv-launcher.apk"

      - name: Verify original signing certificate and Android package version
        env:
          EXPECTED_CERT: 8fe6773542f4b40c7a43f06a28989ab73841c0413741c16131ef9472d57fe4ae
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/v46/tv-launcher.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL" = "$EXPECTED_CERT" || { echo "Certificate mismatch"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "^package: name='com.gathin.tvhome' versionCode='12' versionName='4.6'"
          sha256sum "$APK"

      - name: Publish stable v4.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 4.6.0 --repo vincent-deprato/tv-launcher-min >/dev/null 2>&1; then
            echo "Release 4.6.0 already exists; refusing to overwrite it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Android-VersionCode: 12

          ## TV-Launcher Min v4.6.0

          - Autorisation d'installation améliorée sur Google TV : accès aux paramètres ou tentative d'ouverture directe de l'installateur Android lorsque TV-Launcher n'apparaît pas dans la liste des sources.
          - Diagnostic CPU enrichi : type de mesure, nombre de cœurs disponibles et durée d'échantillonnage.
          - Conservation du téléchargement sécurisé et de la confirmation Android avant toute mise à jour.

          **Android-VersionCode: 12**

          **Important :** certains firmwares Google TV peuvent toujours imposer une autorisation ADB. La nouvelle solution est à confirmer sur les appareils concernés ; elle ne contourne pas les restrictions Android.

          APK officiel signé avec le même certificat que les Releases précédentes.
          NOTES
          gh release create 4.6.0 "$RUNNER_TEMP/v46/tv-launcher.apk#tv-launcher.apk" \
            --repo vincent-deprato/tv-launcher-min \
            --target main \
            --title "TV-Launcher Min v4.6.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
