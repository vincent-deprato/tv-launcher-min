name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'launcher/**'
              - '.github/workflows/ci.yml'

  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools requirements
        run: python3 -m pip install -q -r tools/requirements.txt
      - name: Check example lists and launcher documentation
        run: python3 -m unittest discover -s tests -v

  launcher:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build unsigned Debug APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Ensure Debug APK is reasonably small
        run: |
          APK=launcher/app/build/outputs/apk/debug/tv-launcher.apk
          test -s "$APK"
          size=$(stat -c %s "$APK")
          echo "debug APK: $((size / 1024)) KB"
          test "$size" -lt 8388608 || { echo "Debug APK exceeds 8 MB"; exit 1; }
